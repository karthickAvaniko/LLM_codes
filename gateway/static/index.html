<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Avaniko AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--surface:#18181b;--border:#27272a;
  --text:#f4f4f5;--muted:#71717a;--accent:#8b5cf6;
  --accent-hover:#7c3aed;--user-bg:#1e1b4b;--ai-bg:#18181b;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;height:100vh;overflow:hidden}

/* ── History sidebar ── */
#sidebar{width:240px;flex-shrink:0;background:#131316;border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .2s}
#sidebar.collapsed{margin-left:-240px}
.side-top{padding:14px;border-bottom:1px solid var(--border)}
.side-new{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:.85rem;cursor:pointer;transition:all .2s}
.side-new:hover{border-color:var(--accent);color:var(--accent)}
#side-list{flex:1;overflow-y:auto;padding:8px}
#side-list::-webkit-scrollbar{width:5px}
#side-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.side-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:7px;
  font-size:.82rem;color:var(--muted);cursor:pointer;margin-bottom:2px;transition:all .15s}
.side-item:hover{background:var(--surface);color:var(--text)}
.side-item.active{background:var(--surface);color:var(--text)}
.side-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .del{opacity:0;border:none;background:none;color:var(--muted);cursor:pointer;font-size:.9rem}
.side-item:hover .del{opacity:.7}
.side-item .del:hover{color:var(--red);opacity:1}

/* ── User / API key box (sidebar) ── */
#user-box{
  margin:10px 12px 0;padding:12px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);font-size:.78rem;
}
#user-box .u-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#user-box .u-avatar{
  width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#fff;flex-shrink:0;
}
#user-box .u-name{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#user-box .u-email{color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#user-box .u-key-row{
  display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;padding:6px 8px;margin-bottom:6px;
}
#user-box .u-key-row code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;color:var(--muted)}
#user-box .u-key-row button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.75rem;flex-shrink:0}
#user-box .u-key-row button:hover{color:var(--accent)}
#user-box .u-stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem}
#user-box .u-stats b{color:var(--text);font-weight:600}

/* ── Thinking mode toggle (sidebar) ── */
#thinking-box{
  margin:10px 12px 0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);display:flex;align-items:center;gap:10px;
}
#thinking-box .t-label{flex:1;display:flex;flex-direction:column;gap:1px}
#thinking-box .t-title{font-size:.82rem;font-weight:600;color:var(--text)}
#thinking-box .t-sub{font-size:.7rem;color:var(--muted)}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{
  position:absolute;cursor:pointer;inset:0;background:#3f3f46;border-radius:999px;
  transition:background .2s;
}
.switch .slider::before{
  content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:transform .2s;
}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::before{transform:translateX(16px)}
#main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.hamburger{background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);
  cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hamburger:hover{border-color:var(--accent);color:var(--accent)}

/* ── Header ── */
header{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.85rem;color:#fff;flex-shrink:0}
header h1{font-size:1rem;font-weight:700}
header span{font-size:.78rem;color:var(--muted);margin-left:4px}
.new-btn{
  margin-left:auto;padding:6px 14px;border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:.8rem;cursor:pointer;
  transition:all .2s;
}
.new-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── Chat area ── */
#chat{flex:1;overflow-y:auto;padding:24px 0;display:flex;flex-direction:column;gap:16px}
#chat::-webkit-scrollbar{width:5px}
#chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.msg{display:flex;gap:12px;padding:0 20px;max-width:860px;margin:0 auto;width:100%}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;
}
.msg.user .avatar{background:var(--accent)}
.msg.ai   .avatar{background:#27272a;color:var(--muted)}
.bubble{
  max-width:75%;padding:12px 16px;border-radius:12px;line-height:1.6;
  font-size:.9rem;white-space:pre-wrap;word-break:break-word;
}
.msg.user .bubble{background:var(--user-bg);border-bottom-right-radius:3px}
.msg.ai   .bubble{background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:3px}

/* file chip in user bubble */
.file-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:#312e81;border-radius:6px;padding:4px 10px;
  font-size:.78rem;margin-bottom:6px;
}
.file-chip svg{opacity:.7}

/* code blocks */
.codewrap{margin:10px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.codehead{display:flex;align-items:center;justify-content:space-between;
  background:#1f1f23;padding:6px 12px;font-size:.72rem;color:var(--muted);
  border-bottom:1px solid var(--border)}
.codehead .copy-btn{background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:2px 10px;font-size:.7rem;cursor:pointer;transition:all .2s}
.codehead .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.codewrap pre{background:#09090b;padding:12px;overflow-x:auto;font-size:.82rem;margin:0;line-height:1.55}
.bubble code{font-family:'Fira Code','Cascadia Code',monospace}
.bubble :not(pre)>code{background:#27272a;border-radius:5px;padding:1px 6px;font-size:.82rem}
.bubble h3{font-size:1rem;margin:10px 0 4px}
.bubble h4{font-size:.92rem;margin:8px 0 3px}

/* scroll-to-bottom button */
#scroll-btn{position:fixed;bottom:110px;right:28px;width:38px;height:38px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;
  display:none;align-items:center;justify-content:center;font-size:1.1rem;z-index:10;
  box-shadow:0 4px 14px rgba(0,0,0,.45);transition:all .2s}
#scroll-btn:hover{border-color:var(--accent);color:var(--accent)}

/* thinking indicator */
.thinking{display:flex;gap:4px;padding:4px 0}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--muted);
  animation:bounce .9s infinite}
.thinking span:nth-child(2){animation-delay:.15s}
.thinking span:nth-child(3){animation-delay:.30s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── Composer ── */
#composer{
  padding:16px 20px;border-top:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.composer-wrap{
  max-width:860px;margin:0 auto;
  background:var(--bg);border:1px solid var(--border);border-radius:12px;
  display:flex;flex-direction:column;transition:border-color .2s;
}
.composer-wrap:focus-within{border-color:var(--accent)}

/* file preview chip */
#file-preview{
  display:none;padding:8px 12px 0;
  flex-wrap:wrap;gap:6px;
}
.preview-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:#312e81;border-radius:6px;padding:4px 10px;font-size:.78rem;
}
.preview-chip button{background:none;border:none;color:#a5b4fc;cursor:pointer;
  font-size:1rem;line-height:1;padding:0 0 0 4px}

#input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 12px}
#msg{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:.9rem;resize:none;max-height:160px;
  font-family:inherit;line-height:1.5;
}
#msg::placeholder{color:var(--muted)}

.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(139,92,246,.12)}

#send{
  width:34px;height:34px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s;
}
#send:hover{background:var(--accent-hover)}
#send:disabled{background:#3f3f46;cursor:not-allowed}

#file-input{display:none}

/* ── Welcome ── */
#welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:40px 20px;text-align:center;
}
#welcome .big-logo{
  width:64px;height:64px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:1.6rem;color:#fff;
}
#welcome h2{font-size:1.5rem;font-weight:700}
#welcome p{color:var(--muted);font-size:.9rem;max-width:400px;line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.pill{
  padding:8px 16px;border-radius:999px;border:1px solid var(--border);
  font-size:.82rem;cursor:pointer;transition:all .2s;background:var(--surface);
}
.pill:hover{border-color:var(--accent);color:var(--accent)}

/* ── Mobile / responsive ── */
@media (max-width:768px){
  /* sidebar becomes a slide-over drawer */
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:30;box-shadow:4px 0 20px rgba(0,0,0,.5)}
  #sidebar.collapsed{margin-left:-260px}
  #sidebar:not(.collapsed)::after{content:"";position:fixed;inset:0 0 0 240px;background:rgba(0,0,0,.5)}
  #backdrop{display:none}
  header h1{font-size:.95rem}
  header span{display:none}
  .msg{padding:0 12px;gap:8px}
  .bubble{max-width:88%;font-size:.92rem}
  .avatar{width:28px;height:28px}
  #composer{padding:10px 12px}
  #input-row{padding:8px 10px;gap:6px}
  .icon-btn,#send{width:38px;height:38px}   /* bigger tap targets */
  #msg{font-size:16px}                        /* 16px stops iOS zoom-on-focus */
  .new-btn{padding:6px 10px;font-size:.75rem}
  #scroll-btn{bottom:90px;right:16px}
  .codewrap pre{font-size:.78rem}
}
@media (max-width:768px) and (display-mode:browser){
  #sidebar{width:240px}
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="side-top">
    <button class="side-new" onclick="newChat()">+ New Chat</button>
  </div>

  <div id="user-box">Loading account…</div>

  <div id="thinking-box">
    <div class="t-label">
      <span class="t-title">🧠 Thinking mode</span>
      <span class="t-sub" id="thinking-sub">Off — faster replies</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="thinking-toggle" onchange="toggleThinking(this.checked)"/>
      <span class="slider"></span>
    </label>
  </div>

  <div id="side-list"></div>
</div>

<div id="main-area">
<header>
  <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('collapsed')" title="Toggle history">☰</button>
  <div class="logo">A</div>
  <h1>Avaniko AI</h1>
  <span>avaniko-ai</span>
  <button class="new-btn" style="margin-left:auto" onclick="location.href='/console'">⚙ Console</button>
</header>

<div id="chat">
  <div id="welcome">
    <div class="big-logo">A</div>
    <h2>How can I help you?</h2>
    <p>Chat with the model or attach a PDF / image for extraction.</p>
    <div class="pills">
      <div class="pill" onclick="quickSend('Explain what you can do')">What can you do?</div>
      <div class="pill" onclick="quickSend('Extract invoice data as JSON')">Invoice → JSON</div>
      <div class="pill" onclick="quickSend('Summarize this document')">Summarize document</div>
      <div class="pill" onclick="quickSend('Write a Python hello world')">Write code</div>
    </div>
  </div>
</div>

<button id="scroll-btn" onclick="jumpToBottom()" title="Jump to latest">↓</button>
<div id="composer">
  <div class="composer-wrap">
    <div id="file-preview"></div>
    <div id="input-row">
      <button class="icon-btn" title="Attach file" onclick="document.getElementById('file-input').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="icon-btn" id="web-btn" title="Web search is automatic. Click to FORCE it on for every message." onclick="toggleWeb()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
        </svg>
      </button>
      <textarea id="msg" rows="1" placeholder="Message Avaniko AI…" oninput="autosize(this)" onkeydown="onKey(event)"></textarea>
      <button id="send" onclick="send()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>
<input type="file" id="file-input" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.xlsx,.docx" onchange="attachFile(event)"/>
</div><!-- /main-area -->

<script>
const chat    = document.getElementById('chat');
const msgEl   = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const fpEl    = document.getElementById('file-preview');

let messages    = [];
let streaming   = false;
let attachedFiles = [];
let webSearch   = false;

// ── smart auto-scroll: follow output only while user is at the bottom ──
let stickToBottom = true;
chat.addEventListener('scroll', ()=>{
  stickToBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  document.getElementById('scroll-btn').style.display = stickToBottom ? 'none' : 'flex';
});
function autoscroll(){ if(stickToBottom) chat.scrollTop = chat.scrollHeight; }
function jumpToBottom(){ stickToBottom = true; chat.scrollTop = chat.scrollHeight;
  document.getElementById('scroll-btn').style.display='none'; }

function toggleWeb(){
  webSearch = !webSearch;
  document.getElementById('web-btn').classList.toggle('active', webSearch);
  msgEl.placeholder = webSearch ? 'Ask with live web search…' : 'Message Avaniko AI…';
}

// ── auto-resize textarea ──────────────────────────────
function autosize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,160)+'px';
  sendBtn.disabled = !el.value.trim() && !attachedFiles.length;
}

function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
}

// ── file attach (multiple supported) ──────────────────
function attachFile(e){
  for(const f of e.target.files){
    if(attachedFiles.length>=20){alert('Max 20 files at once — send the rest in a second message');break;}
    attachedFiles.push(f);
  }
  e.target.value='';
  renderChips();
}

// paste a screenshot (Ctrl+V / mobile paste) → attaches like a file
let pasteCount = 0;
document.addEventListener('paste', e=>{
  const items = e.clipboardData?.items || [];
  let grabbed = false;
  for(const it of items){
    if(it.type.startsWith('image/')){
      const blob = it.getAsFile();
      if(blob && attachedFiles.length < 20){
        pasteCount++;
        const ext = (it.type.split('/')[1]||'png').replace('jpeg','jpg');
        attachedFiles.push(new File([blob], `screenshot-${pasteCount}.${ext}`, {type: it.type}));
        grabbed = true;
      }
    }
  }
  if(grabbed){ e.preventDefault(); renderChips(); msgEl.focus(); }
});
function renderChips(){
  if(!attachedFiles.length){
    fpEl.style.display='none'; fpEl.innerHTML='';
    sendBtn.disabled=!msgEl.value.trim();
    return;
  }
  fpEl.style.display='flex';
  fpEl.innerHTML=attachedFiles.map((f,i)=>`<span class="preview-chip">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
    </svg>
    ${f.name}
    <button onclick="removeFile(${i})">×</button>
  </span>`).join('');
  sendBtn.disabled=false;
}
function removeFile(i){
  attachedFiles.splice(i,1);
  renderChips();
}
function clearFile(){
  attachedFiles=[];
  renderChips();
}

// ── render markdown (HTML-safe, streaming-safe) ───────
function escHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function inlineMd(s){ // s is already escaped
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^#{3,}\s+(.*)$/gm,'<h4>$1</h4>');
  s=s.replace(/^##?\s+(.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/^\s*[-*]\s+(.*)$/gm,'&nbsp;•&nbsp;$1');
  return s;
}

function render(text){
  // split on ``` — odd parts are code. An UNCLOSED block (still streaming)
  // renders as a live code box instead of raw broken text.
  const parts=text.split('```');
  let html='';
  for(let i=0;i<parts.length;i++){
    if(i%2===0){ html+=inlineMd(escHtml(parts[i])); continue; }
    let code=parts[i], lang='';
    const nl=code.indexOf('\n');
    if(nl>-1){ lang=code.slice(0,nl).trim(); code=code.slice(nl+1); }
    else { lang=code.trim(); code=''; }
    html+=`<div class="codewrap"><div class="codehead"><span>${escHtml(lang)||'code'}</span>`+
          `<button class="copy-btn" onclick="copyCode(this)">Copy</button></div>`+
          `<pre><code>${escHtml(code)}</code></pre></div>`;
  }
  return html;
}

function copyCode(btn){
  const code=btn.closest('.codewrap').querySelector('pre code').innerText;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent='Copied ✓';
    setTimeout(()=>btn.textContent='Copy',1500);
  });
}

// ── add message bubble ────────────────────────────────
function addBubble(role, content='', fileInfo=null){
  const welcome=document.getElementById('welcome');
  if(welcome) welcome.remove();

  const wrap=document.createElement('div');
  wrap.className=`msg ${role}`;

  const av=document.createElement('div');
  av.className='avatar';
  av.textContent=role==='user'?'U':'A';

  const bub=document.createElement('div');
  bub.className='bubble';

  if(fileInfo){
    bub.innerHTML=`<div class="file-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>${fileInfo}</div>`;
    if(content) bub.innerHTML+=`<div>${content}</div>`;
  } else if(role==='ai' && content==='__thinking__'){
    bub.innerHTML='<div class="thinking"><span></span><span></span><span></span></div>';
  } else {
    bub.innerHTML=render(content);
  }

  wrap.appendChild(av);
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  stickToBottom=true; chat.scrollTop=chat.scrollHeight;
  return bub;
}

// ── api key ───────────────────────────────────────────
function getApiKey(){
  let k=localStorage.getItem('avaniko_api_key');
  if(!k){
    k=(prompt('Enter your Avaniko API key (ak-...)')||'').trim();
    if(k) localStorage.setItem('avaniko_api_key', k);
  }
  return k;
}

function maskKey(k){
  if(!k) return '';
  return k.length<=10 ? k : k.slice(0,6)+'…'+k.slice(-4);
}

function changeApiKey(){
  const k=(prompt('Enter a different Avaniko API key (ak-...)')||'').trim();
  if(k){ localStorage.setItem('avaniko_api_key', k); loadUserBox(); }
}

function copyApiKey(){
  navigator.clipboard.writeText(getApiKey()||'').then(()=>{
    const btn=document.getElementById('copy-key-btn');
    if(btn){ const old=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=old,1200); }
  });
}

// ── user / api key box ────────────────────────────────
async function loadUserBox(){
  const box=document.getElementById('user-box');
  const key=localStorage.getItem('avaniko_api_key');
  if(!key){ box.innerHTML='<span style="color:var(--muted)">No API key set yet</span>'; return; }
  try{
    const res=await fetch('/v1/usage',{headers:{'Authorization':'Bearer '+key}});
    if(res.status===401){
      box.innerHTML='<span style="color:#f87171">⚠ Invalid API key</span>'+
        '<button style="margin-top:6px;width:100%;padding:6px;border-radius:7px;border:1px solid var(--border);'+
        'background:transparent;color:var(--text);font-size:.75rem;cursor:pointer" onclick="localStorage.removeItem(\'avaniko_api_key\');changeApiKey()">Set new key</button>';
      return;
    }
    const u=await res.json();
    // first-ever load (no local override yet): start from the admin-set
    // per-key default so the toggle reflects what the console configured
    if(localStorage.getItem('avaniko_thinking')===null && typeof u.thinking==='boolean'){
      thinkingMode = u.thinking;
      document.getElementById('thinking-toggle').checked = thinkingMode;
      document.getElementById('thinking-sub').textContent =
        thinkingMode ? 'On — deeper reasoning, slower' : 'Off — faster replies';
    }
    const isAdmin = u.name==='admin' && u.note;
    const nameLabel = isAdmin ? 'Admin' : (u.name || 'API user');
    const initial = (nameLabel[0]||'A').toUpperCase();
    box.innerHTML = `
      <div class="u-row">
        <div class="u-avatar">${escHtml(initial)}</div>
        <div style="min-width:0">
          <div class="u-name">${escHtml(nameLabel)}</div>
          <div class="u-email">${escHtml(u.email || '')}</div>
        </div>
      </div>
      <div class="u-key-row">
        <code>${escHtml(maskKey(key))}</code>
        <button id="copy-key-btn" title="Copy API key" onclick="copyApiKey()">⧉</button>
        <button title="Use a different key" onclick="changeApiKey()">⟳</button>
      </div>
      <div class="u-stats">
        <span>Requests: <b>${u.requests ?? '—'}</b></span>
        <span>${isAdmin ? 'Master key' : (u.daily_limit ? `Limit: <b>${u.daily_limit}</b>/day` : '')}</span>
      </div>`;
  }catch(err){
    box.innerHTML='<span style="color:var(--muted)">Could not load account</span>';
  }
}

// ── thinking mode toggle ──────────────────────────────
let thinkingMode = localStorage.getItem('avaniko_thinking') === '1';
function toggleThinking(on){
  thinkingMode = on;
  localStorage.setItem('avaniko_thinking', on ? '1' : '0');
  document.getElementById('thinking-sub').textContent =
    on ? 'On — deeper reasoning, slower' : 'Off — faster replies';
}

// ── stream helper ─────────────────────────────────────
async function streamResponse(endpoint, body, bubbleEl){
  const isFormData = body instanceof FormData;
  const headers = {'Authorization':'Bearer '+getApiKey()};
  if(!isFormData) headers['Content-Type']='application/json';
  const res = await fetch(endpoint, {
    method:'POST',
    headers,
    body: isFormData ? body : JSON.stringify(body),
  });
  if(res.status===401){
    localStorage.removeItem('avaniko_api_key');
    throw new Error('Invalid API key — reload the page and enter it again');
  }
  if(!res.ok) throw new Error(`HTTP ${res.status}`);

  const reader  = res.body.getReader();
  const decoder = new TextDecoder();
  let   buf='', full='';

  bubbleEl.innerHTML=''; // clear thinking dots

  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=decoder.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop()||'';
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const raw=line.slice(5).trim();
      if(raw==='[DONE]') break;
      let obj; try{ obj=JSON.parse(raw); }catch{ continue; }
      if(obj.error) throw new Error(obj.error.message||'Server error');
      if(obj.status && !full){
        bubbleEl.innerHTML='<em style="color:var(--muted)">⏳ '+obj.status+'</em>';
        autoscroll();
        continue;
      }
      const token=obj.token||'';
      if(token){
        full+=token;
        bubbleEl.innerHTML=render(full);
        autoscroll();
      }
    }
  }
  return full;
}

// ── send ──────────────────────────────────────────────
async function send(){
  if(streaming) return;
  const text=msgEl.value.trim();
  const files=attachedFiles.slice();
  if(!text&&!files.length) return;

  streaming=true;
  sendBtn.disabled=true;

  // user bubble
  addBubble('user', text, files.length ? files.map(f=>f.name).join(', ') : null);
  msgEl.value=''; msgEl.style.height='auto';
  clearFile();

  // assistant bubble (thinking)
  const aiBub=addBubble('ai','__thinking__');

  try{
    if(files.length){
      const fd=new FormData();
      for(const f of files) fd.append('files',f);
      fd.append('question',text||'Describe the content of this file in detail. If it is a document (invoice, statement, form), summarize the key information in plain language.');
      await streamResponse('/files/ask', fd, aiBub);
    } else {
      messages.push({role:'user',content:text});
      const full=await streamResponse('/chat',{messages, web_search: webSearch, thinking: thinkingMode}, aiBub);
      messages.push({role:'assistant',content:full});
    }
  }catch(err){
    aiBub.innerHTML=`<span style="color:#f87171">⚠ ${err.message}</span>`;
  }finally{
    streaming=false;
    sendBtn.disabled=!msgEl.value.trim()&&!attachedFiles.length;
    persistCurrent();   // save this conversation to history
  }
}

function quickSend(text){
  msgEl.value=text;
  sendBtn.disabled=false;
  send();
}

// ── Chat history (saved in this browser) ──────────────
let convos = JSON.parse(localStorage.getItem('avaniko_convos')||'[]');
let curId  = null;

function saveConvos(){ localStorage.setItem('avaniko_convos', JSON.stringify(convos.slice(0,100))); }

function persistCurrent(){
  if(!messages.length) return;
  const title = (messages.find(m=>m.role==='user')?.content||'New chat').slice(0,40);
  let c = convos.find(x=>x.id===curId);
  if(!c){ c={id:curId=Date.now()+'', title, messages:[]}; convos.unshift(c); }
  c.title=title; c.messages=messages.slice();
  // move to top
  convos = [c, ...convos.filter(x=>x.id!==c.id)];
  saveConvos(); renderSide();
}

function renderSide(){
  const el=document.getElementById('side-list');
  el.innerHTML=convos.map(c=>`<div class="side-item ${c.id===curId?'active':''}" onclick="loadConvo('${c.id}')">
    <span class="t">${escHtml(c.title)}</span>
    <button class="del" onclick="event.stopPropagation();delConvo('${c.id}')">×</button>
  </div>`).join('') || '<div style="color:var(--muted);font-size:.78rem;padding:10px">No saved chats yet</div>';
}

const isMobile = ()=>window.matchMedia('(max-width:768px)').matches;
function closeSidebarOnMobile(){ if(isMobile()) document.getElementById('sidebar').classList.add('collapsed'); }

function loadConvo(id){
  const c=convos.find(x=>x.id===id); if(!c) return;
  curId=id; messages=c.messages.slice();
  chat.innerHTML='';
  for(const m of messages) addBubble(m.role==='user'?'user':'ai', m.content);
  renderSide(); closeSidebarOnMobile();
}

function delConvo(id){
  convos=convos.filter(x=>x.id!==id); saveConvos();
  if(curId===id) newChat(); else renderSide();
}

function newChat(){
  messages=[]; curId=null;
  chat.innerHTML=`<div id="welcome">
    <div class="big-logo">A</div>
    <h2>How can I help you?</h2>
    <p>Chat with the model or attach a PDF / image for extraction.</p>
    <div class="pills">
      <div class="pill" onclick="quickSend('Explain what you can do')">What can you do?</div>
      <div class="pill" onclick="quickSend('Extract invoice data as JSON')">Invoice → JSON</div>
      <div class="pill" onclick="quickSend('Summarize this document')">Summarize document</div>
      <div class="pill" onclick="quickSend('Write a Python hello world')">Write code</div>
    </div>
  </div>`;
  renderSide(); closeSidebarOnMobile();
}
renderSide();
if(isMobile()) document.getElementById('sidebar').classList.add('collapsed');

document.getElementById('thinking-toggle').checked = thinkingMode;
document.getElementById('thinking-sub').textContent =
  thinkingMode ? 'On — deeper reasoning, slower' : 'Off — faster replies';
loadUserBox();

msgEl.addEventListener('input',()=>{
  sendBtn.disabled=!msgEl.value.trim()&&!attachedFiles.length;
});
</script>
